.lq{background:${m.bg};color:${m.ink};min-height:100%;
  font-family:Inter,-apple-system,system-ui,"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;position:relative;font-feature-settings:"lnum";}
.lq *{box-sizing:border-box;}
.lq-wrap{max-width:820px;margin:0 auto;padding:0 18px 56px;}
.lq-bar{display:flex;align-items:center;gap:10px;padding:14px 0 18px;flex-wrap:wrap;}
.lq-logo{background:none;border:none;cursor:pointer;padding:0;font:inherit;font-weight:700;font-size:15px;color:${m.ink};letter-spacing:-.01em;}
.lq-stars{display:flex;gap:3px;margin-left:auto;font-size:17px;color:${m.line};}
.lq-stars .on{color:${m.orange};}
.lq-nav{display:flex;gap:6px;flex-wrap:wrap;}
.lq-nav button{background:${m.panel};border:1px solid ${m.line};color:${m.ink};font:inherit;font-size:13px;font-weight:500;padding:5px 12px;border-radius:8px;cursor:pointer;}
.lq-nav button:active{transform:scale(.96);}
.lq button:focus-visible,.lq input:focus-visible,.lq a:focus-visible{outline:2px solid ${m.primary};outline-offset:2px;}

.lq h1{font-size:clamp(32px,7vw,54px);line-height:1.04;letter-spacing:-.035em;margin:0 0 14px;font-weight:700;}
.lq h2{font-size:24px;letter-spacing:-.024em;line-height:1.23;margin:0 0 8px;font-weight:700;}
.lq h3{font-size:17px;letter-spacing:-.01em;margin:0 0 6px;font-weight:600;}
.lq p{line-height:1.55;margin:0 0 12px;max-width:64ch;color:${m.ink2};font-size:16px;}
.lq .dim{color:${m.muted};}
.lq .eq{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:13px;color:${m.ink2};background:${m.panel};border:1px solid ${m.line};border-radius:8px;padding:10px 12px;display:inline-block;line-height:1.6;}

.lq-banner{width:100%;height:clamp(150px,34vw,230px);display:block;object-fit:cover;}

.lq-stage{border:1px solid ${m.line};border-radius:12px;background:${m.panel};overflow:hidden;}
.lq-head{display:flex;gap:10px;align-items:center;margin:20px 0 10px;flex-wrap:wrap;}
.lq-badge{background:${m.panel};border:1px solid ${m.line};color:${m.primary};font-weight:600;font-size:12px;letter-spacing:.01em;padding:3px 9px;border-radius:999px;}

.lq-ctrl{display:grid;gap:14px;margin:18px 0 6px;}
.lq-row{display:grid;gap:6px;}
.lq-row label{font-size:14px;display:flex;justify-content:space-between;gap:12px;color:${m.ink2};}
.lq-row .val{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;color:${m.ink};font-weight:600;}
.lq input[type=range]{width:100%;accent-color:${m.primary};height:28px;}
.lq-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center;}
.lq-btn{background:${m.primary};color:#fff;border:1px solid transparent;font:inherit;font-weight:500;font-size:16px;padding:12px 22px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;}
.lq-btn:active{background:${m.primaryActive};transform:scale(.97);}
.lq-btn.ghost{background:${m.panel};color:${m.ink};border:1px solid ${m.line};}
.lq-btn.ghost:active{background:${m.bg};}

.lq-verdict{margin-top:14px;padding:16px 18px;border-radius:12px;font-size:16px;line-height:1.55;color:${m.ink};}
.lq-verdict b{display:block;font-size:17px;margin-bottom:4px;letter-spacing:-.01em;}
.lq-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px;}
.lq-stat{background:${m.panel};border:1px solid ${m.line};border-radius:12px;padding:12px 14px;}
.lq-stat .l{font-size:12.5px;color:${m.muted};font-weight:600;}
.lq-stat .v{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-top:4px;color:${m.ink};}
.lq-stat .s{font-size:12.5px;color:${m.muted};margin-top:4px;}
.lq-stat.ok{background:${m.greenL};border-color:${m.greenL};}
.lq-stat.no{background:${m.orangeL};border-color:${m.orangeL};}
.lq-verdict.ok{background:${m.greenL};}
.lq-verdict.no{background:${m.orangeL};}
.lq-check{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;align-items:center;}
.lq-check span{font-size:14px;padding:6px 11px;border-radius:999px;background:${m.panel};border:1px solid ${m.line};color:${m.muted};}
.lq-check span.done{background:${m.greenL};border-color:${m.greenL};color:${m.ink};font-weight:600;}

/* \uC2A4\uD14C\uC774\uC9C0 \uB9F5 */
.lq-map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 8px;}
.lq-node{background:${m.panel};border:1px solid ${m.line};border-radius:12px;padding:18px 16px 16px;text-align:left;cursor:pointer;font:inherit;color:${m.ink};display:grid;gap:8px;justify-items:start;}
.lq-node:active{transform:scale(.98);}
.lq-node.locked{opacity:.5;cursor:not-allowed;}
.lq-node.cleared{background:${m.greenL};border-color:${m.greenL};}
.lq-node .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:${m.bg};color:${m.ink};border:1px solid ${m.line};}
.lq-node.cleared .num{background:${m.green};color:#fff;border-color:${m.green};}
.lq-node .t{font-weight:600;font-size:15px;line-height:1.3;letter-spacing:-.01em;}
.lq-node .s{font-size:12.5px;color:${m.muted};}
@media (max-width:600px){.lq-map{grid-template-columns:1fr;}.lq-node{grid-template-columns:40px 1fr;column-gap:14px;align-items:center;}.lq-node .num{grid-row:1/3;}}

/* \uD074\uB9AC\uC5B4 \uC624\uBC84\uB808\uC774 */
.lq-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;z-index:50;padding:20px;}
.lq-modal{background:${m.panel};border-radius:16px;padding:32px 28px 26px;max-width:440px;width:100%;text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.04),0 23px 52px rgba(0,0,0,.07);animation:lq-pop .4s cubic-bezier(.2,1.3,.4,1) both;position:relative;overflow:hidden;}
.lq-modal .big{font-size:52px;line-height:1;margin-bottom:8px;}
.lq-modal h2{margin-bottom:8px;}
.lq-modal p{margin:0 auto 20px;}
@keyframes lq-pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.lq-confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:lq-fall 2.6s linear infinite;}
@keyframes lq-fall{to{transform:translateY(560px) rotate(540deg);}}
@media (prefers-reduced-motion:reduce){.lq-modal{animation:none}.lq-confetti{display:none}}

/* \uC5F0\uAD6C\uC2E4 \uC18C\uAC1C */
.lq-topics{display:grid;gap:14px;margin:18px 0;}
.lq-topic{display:grid;grid-template-columns:260px 1fr;gap:18px;background:${m.panel};border:1px solid ${m.line};border-radius:12px;padding:16px;align-items:center;}
.lq-topic svg,.lq-topic img{width:100%;height:auto;aspect-ratio:5/3;object-fit:cover;display:block;border-radius:8px;}
.lq-topic p{font-size:14.5px;margin:0 0 8px;}
.lq-pubs{display:flex;flex-wrap:wrap;gap:6px;}
.lq-pubs span{font-size:12px;background:${m.bg};border-radius:5px;padding:3px 8px;color:${m.muted};}
@media (max-width:640px){.lq-topic{grid-template-columns:1fr;}}
.lq-facts{border-top:1px solid ${m.line};margin-top:22px;padding-top:18px;display:grid;gap:12px;}
.lq-fact{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:14.5px;align-items:baseline;}
.lq-fact dt{color:${m.muted};}
.lq-fact dd{margin:0;color:${m.ink2};}
.lq-tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none;}
.lq-tags li{font-size:13px;background:${m.panel};border:1px solid ${m.line};border-radius:5px;padding:4px 9px;color:${m.ink2};}
.lq a{color:${m.primary};text-decoration:none;}
@media (max-width:520px){.lq-fact{grid-template-columns:1fr;gap:2px;}}

/* Q&A */
.lq-chat{border:1px solid ${m.line};border-radius:12px;background:${m.panel};padding:14px;margin-top:14px;}
.lq-log{display:grid;gap:12px;max-height:340px;overflow-y:auto;padding-right:4px;}
.lq-msg{font-size:15px;line-height:1.55;white-space:pre-wrap;color:${m.ink2};}
.lq-msg.me{justify-self:end;background:${m.bg};border-radius:12px 12px 3px 12px;padding:9px 13px;max-width:85%;color:${m.ink};}
.lq-msg.ai{border-left:2px solid ${m.line};padding-left:12px;max-width:95%;}
.lq-ask{display:flex;gap:8px;margin-top:12px;}
.lq-in{flex:1;background:${m.panel};border:1px solid #dddddd;color:${m.ink};font:inherit;font-size:15px;padding:10px 12px;border-radius:4px;min-width:0;}
.lq-in:focus{outline:none;border-color:${m.primary};box-shadow:0 0 0 3px ${m.skyL};}
.lq-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.lq-chips button{background:${m.panel};border:1px solid ${m.line};color:${m.ink2};font:inherit;font-size:13px;padding:5px 10px;border-radius:5px;cursor:pointer;}
.lq-chips button:active{background:${m.bg};}
